name: Acquire and publish P0 P1 source bytes

on:
  workflow_dispatch:
  push:
    branches: [p0-p1-acquisition]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  acquire_publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: gretil
            repo: tokushige-koyasan/gretil-corpus
          - id: vedaweb-data
            repo: VedaWebProject/vedaweb-data
          - id: rigveda
            repo: sanskrit-texts/rigveda
          - id: dcs
            repo: tokushige-koyasan/dcs-corpus
          - id: indic-primary-sources
            repo: AnotherAdhikari/indic-primary-sources
          - id: itihasa
            repo: rahular/itihasa
          - id: muktabodha
            repo: tokushige-koyasan/muktabodha-corpus
          - id: jyotisha
            repo: maximally0/jyotisha-corpus
          - id: raw-etexts
            repo: sanskrit/raw_etexts
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          fetch-depth: 1
          path: _source
      - name: Checkout corpus target
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 1
          path: _target
          token: ${{ github.token }}
      - name: Initialize target branch
        shell: bash
        run: |
          set -euo pipefail
          cd _target
          git fetch origin p0-p1-data:p0-p1-data || true
          if git show-ref --verify --quiet refs/heads/p0-p1-data; then
            git checkout p0-p1-data
          else
            git checkout -b p0-p1-data origin/main
          fi
      - name: Package source and publish
        shell: bash
        run: |
          set -euo pipefail
          id='${{ matrix.id }}'
          repo='${{ matrix.repo }}'
          src_commit=$(git -C _source rev-parse HEAD)
          src_date=$(git -C _source log -1 --format='%cI')
          mkdir -p _work _target/data/p0-p1/sources/${id}
          printf '%s\n' "$id" > _work/source_id.txt
          printf '%s\n' "$repo" > _work/upstream_repo.txt
          printf '%s\n' "$src_commit" > _work/upstream_commit.txt
          printf '%s\n' "$src_date" > _work/upstream_commit_date.txt
          find _source -maxdepth 2 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'README*' \) -print | sort > _work/legal_files.txt || true
          tar --exclude=.git --exclude='./p0-p1-*' -C _source -czf "_work/${id}.tar.gz" .
          sha256sum "_work/${id}.tar.gz" > "_work/${id}.tar.gz.sha256"
          size=$(stat -c '%s' "_work/${id}.tar.gz")
          if [ "$size" -gt 94371840 ]; then
            split -b 90m -d -a 4 "_work/${id}.tar.gz" "_work/${id}.tar.gz.part-"
            cp "_work/${id}.tar.gz.sha256" "_work/WHOLE_ARCHIVE_SHA256.txt"
            rm "_work/${id}.tar.gz"
          fi
          cp _work/source_id.txt _work/upstream_repo.txt _work/upstream_commit.txt _work/upstream_commit_date.txt _work/legal_files.txt "_target/data/p0-p1/sources/${id}/"
          cp _work/*.tar.gz.sha256 _work/WHOLE_ARCHIVE_SHA256.txt "_target/data/p0-p1/sources/${id}/" 2>/dev/null || true
          find _work -maxdepth 1 -type f -name "${id}.tar.gz.part-*" -exec cp {} "_target/data/p0-p1/sources/${id}/" \; || true
          if [ -f "_work/${id}.tar.gz" ]; then cp "_work/${id}.tar.gz" "_target/data/p0-p1/sources/${id}/"; fi
          (cd _target && find "data/p0-p1/sources/${id}" -type f -print0 | sort -z | xargs -0 sha256sum > "data/p0-p1/sources/${id}/FILES.sha256")
          cd _target
          git config user.name 'hindu-corpus acquisition bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/p0-p1/sources/${id}"
          git commit -m "acquire P0/P1 source: ${id}" || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin p0-p1-data || true
            if git push origin HEAD:p0-p1-data; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1