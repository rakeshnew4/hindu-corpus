name: Acquire P0 P1 source bytes

on:
  workflow_dispatch:
  push:
    branches: [p0-p1-acquisition]

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - id: gretil
            repo: tokushige-koyasan/gretil-corpus
          - id: vedaweb-data
            repo: VedaWebProject/vedaweb-data
          - id: rigveda
            repo: sanskrit-texts/rigveda
          - id: dcs
            repo: tokushige-koyasan/dcs-corpus
          - id: indic-primary-sources
            repo: AnotherAdhikari/indic-primary-sources
          - id: itihasa
            repo: rahular/itihasa
          - id: muktabodha
            repo: tokushige-koyasan/muktabodha-corpus
          - id: jyotisha
            repo: maximally0/jyotisha-corpus
          - id: raw-etexts
            repo: sanskrit/raw_etexts
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          fetch-depth: 1
      - name: Package source with provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _acquisition_meta
          printf '%s\n' '${{ matrix.id }}' > _acquisition_meta/source_id.txt
          printf '%s\n' '${{ matrix.repo }}' > _acquisition_meta/upstream_repo.txt
          git rev-parse HEAD > _acquisition_meta/upstream_commit.txt
          git log -1 --format='%cI' > _acquisition_meta/upstream_commit_date.txt
          find . -maxdepth 2 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'README*' \) -print > _acquisition_meta/legal_files.txt || true
          sha256sum _acquisition_meta/* > _acquisition_meta/meta.sha256
          tar --exclude=.git -czf "p0-p1-${{ matrix.id }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: p0-p1-${{ matrix.id }}
          path: p0-p1-${{ matrix.id }}.tar.gz
          retention-days: 30